name: tests
on:
  push:
    branches: [main, integration]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries (offscreen rendering, OpenCV, C++ build)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libglib2.0-0 cmake g++
      - name: Tests (sets up the environment and fetches the pinned assets first)
        run: make test
