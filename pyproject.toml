[project]
name = "teleop-il"
version = "0.1.0"
description = "Webcam hand-teleop of a simulated arm in MuJoCo, demonstrations, and an imitation policy."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=1.2.3",
    "mink>=1.4.0",
    "mujoco==4.0.1",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleop_il"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
